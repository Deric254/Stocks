name: Release

# Runs on every push to main. Bumps the patch version automatically,
# builds a self-contained executable (frontend bundled inside — no
# separate Node server needed to run it), and publishes a GitHub
# Release with that executable attached. Other systems can then poll
# GET /api/version/check (see app.py) to discover and download it.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

# Serialize releases. Without this, two pushes landing close together can
# both read the same starting version, both compute the same next version,
# and race to create the same tag - which is exactly how VERSION and git
# tags drifted out of sync before. cancel-in-progress must stay false: we
# want runs to queue, not to cancel a release that's already mid-build.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump-version:
    runs-on: ubuntu-latest
    # Belt-and-suspenders alongside the native `[skip ci]` push-skip: never
    # let the bot's own version-bump commit trigger another release run.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine current version (self-healing against drift)
        id: current
        run: |
          set -e
          FILE_VERSION=$(cat VERSION 2>/dev/null || echo "0.0.0")
          # Tags are the real record of what's been released; the VERSION
          # file is just a cached copy baked into the build. If they've
          # ever drifted (as they did here), trust whichever is higher so
          # we never emit a version/tag that already exists.
          TAG_VERSION=$(git tag -l 'v*' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1)
          TAG_VERSION="${TAG_VERSION:-0.0.0}"
          HIGHEST=$(printf '%s\n%s\n' "$FILE_VERSION" "$TAG_VERSION" | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1)
          if [ "$HIGHEST" != "$FILE_VERSION" ]; then
            echo "::warning::VERSION file ($FILE_VERSION) was behind latest tag ($TAG_VERSION) - self-healing from tags."
          fi
          echo "current=$HIGHEST" >> "$GITHUB_OUTPUT"

      - name: Bump version
        id: bump
        run: |
          set -e
          CURRENT="${{ steps.current.outputs.current }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          BUMP_TYPE="${{ github.event.inputs.bump || 'patch' }}"

          if [ "$BUMP_TYPE" = "major" ]; then
            MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0
          elif [ "$BUMP_TYPE" = "minor" ]; then
            MINOR=$((MINOR+1)); PATCH=0
          else
            PATCH=$((PATCH+1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v$NEW_VERSION"

          # Guard against the exact failure this repo hit: a tag that
          # already exists (locally, because fetch-depth:0 pulled it down,
          # or on the remote from a run that half-completed). Keep bumping
          # the patch number until we land on a genuinely free tag, instead
          # of crashing the whole pipeline. Capped so a persistent lookup
          # failure can't spin this forever - after 20 attempts something
          # else is wrong and we want a loud, investigable failure.
          ATTEMPTS=0
          while git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1 || \
                git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; do
            ATTEMPTS=$((ATTEMPTS+1))
            if [ "$ATTEMPTS" -ge 20 ]; then
              echo "::error::Could not find a free tag after 20 attempts starting from $CURRENT. Investigate tag/VERSION state manually."
              exit 1
            fi
            echo "::warning::Tag $TAG already exists, bumping patch further."
            PATCH=$((PATCH+1))
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            TAG="v$NEW_VERSION"
          done

          echo "$NEW_VERSION" > VERSION
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT -> $NEW_VERSION"

      - name: Commit and tag (atomic, with retry on race)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"

          # Push the commit BEFORE creating the tag. If a rebase happens
          # here, the commit gets a new SHA - creating the tag first (as
          # the original workflow effectively did) would leave it pointing
          # at an orphaned pre-rebase commit, off of main's real history.
          # Tagging only after a confirmed-successful push guarantees the
          # tag always points at a commit that's actually on main.
          for i in 1 2 3; do
            if git push origin main; then
              break
            fi
            echo "Push to main rejected, fetching and rebasing (attempt $i)..."
            git fetch origin main
            git rebase origin/main
            if [ "$i" = "3" ]; then
              echo "::error::Could not push version bump to main after 3 attempts."
              exit 1
            fi
          done

          # Now HEAD is guaranteed to be the real, pushed commit on main.
          git tag "${{ steps.bump.outputs.tag }}"

          # Tag push is the step that failed before. If the tag somehow
          # exists on the remote by the time we push (another concurrent
          # actor), fail loudly and clearly instead of a bare git error -
          # this should be unreachable given concurrency: group above and
          # the pre-check in the Bump version step, so surface it plainly.
          if ! git push origin "${{ steps.bump.outputs.tag }}"; then
            echo "::error::Tag ${{ steps.bump.outputs.tag }} was rejected by the remote even after pre-checks. Investigate for a concurrent release run outside this workflow's concurrency group."
            exit 1
          fi

  build:
    needs: bump-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: stockintel-windows.exe
            build_name: stockintel
          - os: ubuntu-latest
            artifact_name: stockintel-linux
            build_name: stockintel
          - os: macos-latest
            artifact_name: stockintel-macos
            build_name: stockintel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # pick up the version-bump commit from the previous job

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: frontend
        env:
          # The packaged app serves the UI and the API from ONE address, so the UI must call
          # the same origin. Without this, Vite picks up the committed frontend/.env.production
          # (a hosted-server placeholder) and the app would call a server that does not exist.
          # A shell variable beats .env files, so the hosted (Vercel) build is not affected.
          VITE_API_URL: ""
        run: |
          npm ci
          npm run build
          if grep -rq "YOUR-RENDER-APP" dist; then
            echo "::error::A placeholder API URL was baked into the frontend build"; exit 1
          fi
          test -f dist/index.html

      - name: Copy frontend build into backend bundle location
        shell: bash
        run: |
          mkdir -p backend/frontend
          cp -r frontend/dist backend/frontend/dist

      - name: Install backend dependencies + PyInstaller
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Copy VERSION into backend bundle location
        shell: bash
        run: cp VERSION backend/VERSION

      - name: Build executable with PyInstaller
        working-directory: backend
        shell: bash
        run: |
          pyinstaller --onefile --name "${{ matrix.build_name }}" \
            --add-data "frontend/dist${{ runner.os == 'Windows' && ';' || ':' }}frontend/dist" \
            --add-data "VERSION${{ runner.os == 'Windows' && ';' || ':' }}." \
            --add-data "data${{ runner.os == 'Windows' && ';' || ':' }}data" \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols \
            --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.lifespan \
            --hidden-import uvicorn.lifespan.on \
            app.py

      - name: Rename artifact per-platform
        shell: bash
        run: |
          cd backend/dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv "${{ matrix.build_name }}.exe" "${{ matrix.artifact_name }}"
          else
            mv "${{ matrix.build_name }}" "${{ matrix.artifact_name }}"
          fi

      - name: Smoke-test the executable (it must serve the UI at /)
        shell: bash
        working-directory: backend/dist
        run: |
          set -e
          chmod +x "./${{ matrix.artifact_name }}" || true
          PORT=18765 "./${{ matrix.artifact_name }}" > smoke.log 2>&1 &
          PID=$!
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:18765/api/ping" >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then echo "::error::executable did not start"; cat smoke.log; kill $PID || true; exit 1; fi
          PAGE=$(curl -fsS http://127.0.0.1:18765/)
          echo "$PAGE" | grep -q 'id="root"' || { echo "::error::/ did not serve the frontend"; echo "$PAGE" | head -c 300; kill $PID || true; exit 1; }
          ASSET=$(echo "$PAGE" | grep -o '/assets/[^"]*\.js' | head -1)
          curl -fsS "http://127.0.0.1:18765$ASSET" -o /dev/null || { echo "::error::bundled JS not served"; kill $PID || true; exit 1; }
          curl -fsS http://127.0.0.1:18765/api/ping >/dev/null
          kill $PID || true
          echo "Executable serves the UI and the API."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: backend/dist/${{ matrix.artifact_name }}
          if-no-files-found: error

  release:
    needs: [bump-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact directories
        run: |
          mkdir -p release_files
          find artifacts -type f -exec cp {} release_files/ \;
          ls -la release_files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump-version.outputs.tag }}
          name: "Stock Intel ${{ needs.bump-version.outputs.tag }}"
          generate_release_notes: true
          files: release_files/*
          body: |
            ## Stock Intel ${{ needs.bump-version.outputs.tag }}

            Automated release. Download the executable for your platform below —
            it bundles the backend API and frontend into a single file; no
            separate Python/Node install needed to run it.

            **Windows:** `stockintel-windows.exe` — double-click to run, opens on http://localhost:8000
            **Linux:** `stockintel-linux` — `chmod +x` then run
            **macOS:** `stockintel-macos` — `chmod +x` then run

            Client systems can check for updates programmatically via:
            `GET /api/version/check` (requires `GITHUB_REPO` env var set to this repo)
